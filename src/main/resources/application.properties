spring.application.name=backend

# Configuracion de MySQL - Aiven / VM
# Soporta dos esquemas de variables de entorno:
#  - DB_URL, DB_USER, DB_PASSWORD: URL completa (uso actual con Aiven, incluye sslMode=REQUIRED). Tiene prioridad si esta definida.
#  - PROD_DB_HOST, PROD_DB_NAME, PROD_DB_USERNAME, PROD_DB_PASSWORD: esquema pedido por el tutorial de despliegue en VM. Se usa si DB_URL no esta definida.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://${PROD_DB_HOST}:3306/${PROD_DB_NAME}?sslMode=REQUIRED&trustServerCertificate=true}
spring.datasource.username=${DB_USER:${PROD_DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${PROD_DB_PASSWORD}}

# Configuracion de JPA e Hibernate (CRITICO: Define el dialecto explicito para solucionar el error de tests)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${PROD_DDL:update}

# Mostrar consultas SQL en consola
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Pool de conexiones: evita reconectar a Aiven en cada peticion
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# Requerido por el tutorial de despliegue en VM (compatibilidad de rutas estilo Ant)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

